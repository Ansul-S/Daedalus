    { id = "k3", status = "covered", answer_quote = "the update keeps its direction" },
]
claims = [
    { claim = "Gradient clipping protects against exploding gradients in deep or recurrent networks.", verdict = "supported", chunk_id = 201, why = "Passage 201 says gradients can grow very large in such networks." },
