[[answer]]
question = 2
note = "strong"
text = """
Clipping protects against exploding gradients: in deep or recurrent networks the gradients can \
blow up, and one huge update can throw the weights far off or turn the loss into NaN. With \
clipping by global norm you compute the norm of all the gradients together, and if it is above \
a threshold you multiply every gradient by the threshold divided by that norm. Because \
everything is scaled by the same factor, the update keeps its direction, whereas clipping each \
value separately can change it.
"""
labels = ["covered", "covered", "covered"]
contradicted = 0
score = 10

[answer.grader_output]
