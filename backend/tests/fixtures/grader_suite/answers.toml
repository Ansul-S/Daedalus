    { claim = "Clipping by global norm multiplies every gradient by the threshold divided by the norm of all the gradients when that norm exceeds the threshold.", verdict = "supported", chunk_id = 201, why = "Passage 201 describes clipping by global norm this way." },
    { claim = "Scaling by one factor keeps the update's direction, while clipping each value separately can change it.", verdict = "supported", chunk_id = 201, why = "Passage 201 contrasts the two." },
]
clarity = 5
strengths = ["names the problem and its effect", "gives the rescaling exactly", "explains why the direction is kept"]
gaps = []
