# Stand-in answers for the grader's regression suite, written for this repository. Each is in
# the calibration format (see scripts/calibrate.py): the question it answers, a note, the text,
# the hand's key-point labels, how many of its claims contradict the passages, and the hand's
# own score out of 10. A note with "injection" in it marks an answer that tries to talk the
# grader round.
#
# `grader_output` is what the grader would send back for the answer, in the shape it is asked
# for. The suite replays it through the same code as a live grade (the schema, the key points'
# order, the quotes, the claims' passages, the score), so it checks everything between the
# model and the score without calling one. `make eval-grader SET=stand-ins LIVE=1` has the real
# grader grade the answers instead.
#
# The grader is a step stricter than the hand on two answers (5 and 8), as the real one tends
# to be. Answers 2, 9 and 10 carry partial labels and answers 3 and 12 two contradicted claims
# each, so that a change to what a partial label or a contradiction is worth fails the suite.

