[project]
name = "daedalus-backend"
version = "0.1.0"
description = "Daedalus API: interview questions generated from your study material, graded against the same sources"
requires-python = ">=3.13"
# Main dependencies = what the deployed API needs. Keep heavy ML libraries in the `ingest` group.
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-ai-slim[google,groq,openai]>=2.42.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# Supply-chain guard: ignore anything uploaded to PyPI in the last week.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.alembic]
script_location = "%(here)s/app/db/migrations"
prepend_sys_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: loads Docling's PDF models; run with `make test-slow`"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
eval = [
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]
glyphs = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
]
ingest = [
    "beautifulsoup4>=4.15.0",
    "docling>=2.126.0",
    "lxml>=6.1.3",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "tokenizers>=0.23.2",
]
