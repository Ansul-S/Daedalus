# Pre-commit hooks for Daedalus.
#
# Install once:
#     uv run pre-commit install
#
# Run against everything:
#     uv run pre-commit run --all-files

# The evaluation corpus and its frozen parsed text are reference material,
# not source code. Formatting or "fixing" them changes the text that
# evaluation labels anchor to and silently invalidates every label —
# trailing-whitespace and end-of-file-fixer did exactly that to
# backend/eval/parsed/ before it was listed here, and the manifest hash
# check is what caught it. Never touch either path.
exclude: ^(corpus/|backend/eval/parsed/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Run from the project environment so mypy sees the installed dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
