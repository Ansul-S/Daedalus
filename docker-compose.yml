services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: daedalus-db
    environment:
      POSTGRES_USER: daedalus
      POSTGRES_PASSWORD: daedalus
      POSTGRES_DB: daedalus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daedalus -d daedalus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
