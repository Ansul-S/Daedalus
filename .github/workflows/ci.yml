# The checks on every push: the backend's lint and tests with the grader's stand-in suite, the
# frontend's lint and build, and the end-to-end walk through the app on fake models. No secrets:
# nothing here reaches a model provider.
name: CI

on:
  push:
    # Dependabot's branches are checked through their pull requests
    branches-ignore: ["dependabot/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch replaces its run; every commit on main keeps its own
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The version the lock was written with
  UV_VERSION: "0.11.29"
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # As in docker-compose.yml, on the port the settings default to
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: daedalus
          POSTGRES_PASSWORD: daedalus
          POSTGRES_DB: daedalus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U daedalus -d daedalus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          enable-cache: true

      # Torch and its CUDA libraries are about 3 GB on Linux, and nothing tested here imports
      # them: every group is installed without them.
      - name: Install every dependency group but torch
        run: |
          skip=$(grep -oE '^name = "(torch|torchvision|triton|nvidia-[a-z0-9-]+)"' uv.lock | cut -d '"' -f 2)
          uv sync --locked --all-groups $(printf -- '--no-install-package %s ' $skip)

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest

      - name: The grader's stand-in suite
        run: uv run --no-sync python -m scripts.evaluate_grader --set stand-ins | tee -a "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Type-checks too, and reads the grader's figures from docs/design.md
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: daedalus
          POSTGRES_PASSWORD: daedalus
          POSTGRES_DB: daedalus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U daedalus -d daedalus"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The API and the worker run under `uv run`, which would otherwise install torch for the
      # ingest group: the environment below is used as it is
      UV_NO_SYNC: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: backend
          enable-cache: true

      - name: Install every dependency group but torch
        working-directory: backend
        run: |
          skip=$(grep -oE '^name = "(torch|torchvision|triton|nvidia-[a-z0-9-]+)"' uv.lock | cut -d '"' -f 2)
          uv sync --locked --all-groups $(printf -- '--no-install-package %s ' $skip)

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend and Playwright's headless Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium

      - run: make e2e

      - name: Keep the trace of a failed walk
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-trace
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
